<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>535250124</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app-card-wrapper">
      <header class="main-header">
        <div class="brand-icon">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              d="M20 21H4v-2h16v2ZM4 7h14V5h2v2h2v12h-2v-2h-6v-6h6V9H4v10H2V5h2v2Zm12 8h4v-2h-4v2Zm2-10H4V3h14v2Z"
            />
          </svg>
        </div>
        <div>
          <h1>Expense Tracker</h1>
          <p class="subtitle">List pengeluaran</p>
        </div>
      </header>

      <section class="stat-highlight-card">
        <div class="stat-header">
          <span>Total Pengeluaran</span>
          <div class="icon-dollar-circle">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                d="M18 22h-6v-2h6v2Zm-6-2h-2v-2h2v2Zm8 0h-2v-2h2v2Zm-8-4h-2v2H8v-2H6v-2h6v2Zm5 2h-2v-4h-3v-2h2V6h2v2h2v2h-2v2h1v6Zm5 0h-2v-6h2v6ZM6 14H4v-2h2v2Zm-2-2H2V6h2v6Zm7 0H9V8H7V6h4v6Zm9 0h-2v-2h2v2ZM6 6H4V4h2v2Zm8 0h-2V4h2v2Zm-2-2H6V2h6v2Z"
              />
            </svg>
          </div>
        </div>
        <h2 class="stat-amount" id="totalAmount">Rp 0</h2>
        <div class="stat-footer">
          <span class="badge-count" id="totalCountBadge">0 Transaksi</span>
        </div>
      </section>

      <section class="card-container">
        <div class="section-title">
          <h3>Tambah Pengeluaran</h3>
        </div>

        <form id="expenseForm">
          <div class="form-group">
            <label for="expenseName">Keterangan Pengeluaran</label>
            <input
              type="text"
              id="expenseName"
              placeholder="Contoh: beli game"
              required
              autocomplete="off"
            />
          </div>

          <div class="form-group">
            <label for="expenseAmount">Nominal Pengeluaran (Rp)</label>
            <input
              type="number"
              id="expenseAmount"
              placeholder="Contoh: 50000"
              min="1"
              required
            />
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="expenseCategory">Kategori</label>
              <select id="expenseCategory">
                <option value="Makanan dan Minuman">Makanan dan Minuman</option>
                <option value="Transportasi">Transportasi</option>
                <option value="Belanja">Belanja</option>
                <option value="Tagihan">Tagihan</option>
                <option value="Hiburan">Hiburan</option>
                <option value="Lainnya">Lainnya</option>
              </select>
            </div>

            <div class="form-group">
              <label for="expenseDate">Tanggal</label>
              <input type="date" id="expenseDate" required />
            </div>
          </div>

          <button type="submit" class="btn btn-primary" id="submitBtn">
            <span>Tambahkan Data</span>
          </button>
        </form>
      </section>

      <section class="card-container">
        <div class="section-title">
          <div>
            <h3>Daftar Pengeluaran</h3>
            <span class="text-muted" id="listTotalText">0 data</span>
          </div>
          <button
            type="button"
            id="clearAllBtn"
            class="btn-text-danger"
            title="Hapus semua data"
          >
            Reset
          </button>
        </div>

        <div class="expense-list" id="expenseList"></div>

        <div class="empty-state" id="emptyState">
          <div class="empty-icon">
            <svg
              xmlns="http://www.w3.org/2000/svg"
              fill="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                d="M5 23H3v-2h2v2Zm8 0h-2v-4h2v4ZM3 21H1v-2h2v2Zm4 0H5v-2h2v2Zm-2-2H3v-2h2v2Zm6 0H9v-4h2v4Zm4 0h-2v-4h2v4Zm-6-4H5v-2h4v2Zm10 0h-4v-2h4v2ZM5 13H1v-2h4v2Zm18 0h-4v-2h4v2ZM9 11H5V9h4v2Zm10 0h-4V9h4v2Zm-8-2H9V5h2v4Zm4 0h-2V5h2v4Zm6-6h2v2h-2v2h-2V5h-2V3h2V1h2v2Zm-8 2h-2V1h2v4Z"
              />
            </svg>
          </div>
          <h4>Belum Ada Pengeluaran</h4>
        </div>
      </section>
    </div>

    <script src="script.js"></script>
  </body>
</html>
